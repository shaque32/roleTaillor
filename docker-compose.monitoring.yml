# Monitoring overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up
# Prometheus :9090, Alertmanager :9093, Grafana :3001 (login required).
# Set GRAFANA_ADMIN_PASSWORD and RT_METRICS_DB_PASSWORD in .env for anything but local use.
services:
  prometheus:
    image: prom/prometheus:v2.53.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana-oss:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
      RT_METRICS_DB_PASSWORD: ${RT_METRICS_DB_PASSWORD:-rt_metrics}
    volumes:
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  promdata:
  alertdata:
  grafanadata:
