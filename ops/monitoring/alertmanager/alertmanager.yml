# Alertmanager config. The default receivers do nothing: alerts show up in the
# Alertmanager and Prometheus UIs only. Uncomment ONE example and put real
# secrets in files or env, never in git.
route:
  receiver: default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      repeat_interval: 1h
    - matchers: [severity="warning"]
      receiver: warning

# A critical alert silences warnings of the same area (cost, latency, errors,
# fabrication, availability), for example GenerationCostCritical hides GenerationCostHigh.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [area]

receivers:
  - name: default
  - name: warning
