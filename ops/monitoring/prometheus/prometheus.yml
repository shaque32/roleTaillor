# Prometheus config for RoleTailor. Host-agnostic: only service names from
# docker-compose.yml are used. On another host, change the targets below.
global:
  scrape_interval: 15s
  evaluation_interval: 1m

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: roletailor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: roletailor-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
