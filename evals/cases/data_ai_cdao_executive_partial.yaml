  Chief Data & AI Officer
  We are a global consumer bank seeking an enterprise leader to set and execute our data and AI strategy.
  You will report to the CEO and present to the board each quarter.
  Responsibilities:
  - Define the enterprise data and AI strategy and own the multi-year budget
  - Lead data governance, MLOps, and responsible AI at scale
