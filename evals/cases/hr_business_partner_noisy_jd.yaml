job: |
  Brightharbor is a global leader in connected devices, and we are proud to be a mission-driven company
  with a vibrant culture. Founded in 2008, we serve millions of customers in over 40 countries. Our
  values are customer obsession, bold thinking, and one team. We are growing fast and looking for
  talented people who want to make an impact. Come build the future with us.

  Benefits and perks: comprehensive medical, dental, and vision coverage; 401(k) with company match;
  unlimited paid time off; 16 weeks of parental leave; a quarterly wellness stipend; free lunch in the
  office; commuter benefits; learning budget; pet insurance; company-wide recharge weeks; and annual
  offsites. Salary range for this role is $135,000 to $165,000 plus equity, depending on experience.

  Brightharbor is an equal opportunity employer. We do not discriminate on the basis of race, color,
  religion, sex, sexual orientation, gender identity, national origin, age, disability, veteran status,
  or any other protected characteristic. Applicants with disabilities may request reasonable
  accommodations. Please review our privacy notice before applying. We participate in E-Verify.

  Senior People Partner
  About the role: you will partner with leaders of our product and engineering organizations.
  - Advise leaders on org design, performance management, and employee relations
  - Run calibration and promotion cycles
  - Use people data to guide workforce planning
  Requirements:
  - 7+ years of HR business partner experience in a technology company
  - Experience with Workday and Greenhouse
  - SHRM-SCP or similar certification preferred
  - Familiarity with Culture Amp and Lattice
