job: |
  Instructional Designer
  Design engaging online learning for corporate customers.
  Responsibilities:
  - Analyze learner needs and write measurable learning objectives
  - Build interactive e-learning modules in Articulate Storyline
  - Package courses as SCORM for our LMS
  - Design assessments and collect learner feedback to improve courses
  Requirements:
  - 3+ years of curriculum or instructional design experience
  - Experience with the ADDIE model
  - Hands-on Articulate Storyline and SCORM
  - Video editing with Camtasia is a plus
  - Adobe Captivate is a plus
canaries: [Articulate Storyline, SCORM, ADDIE, Camtasia, Adobe Captivate]
expect:
  min_changes: 0
  live_max_changes: 3
  live_expected_gaps: [Articulate Storyline, SCORM]
notes: Curriculum, assessment, and objectives are transferable; authoring tools are real gaps, so a good tailoring reframes teaching as learning design with few edits and no invented tools.
