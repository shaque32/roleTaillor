job: |
  Senior Analytics Engineer, Growth Data
  Join a small data team that owns the models behind every metric at a fast-growing consumer app.
  What you will do:
  - Own our dbt project and keep it fast, tested, and documented
  - Model event data in BigQuery for product, marketing, and finance
  - Maintain the Looker semantic layer and partner with analysts on self-serve analytics
  - Write clear data modeling standards and review teammates' pull requests
  Requirements:
  - 5+ years in analytics engineering or data analytics
  - Strong SQL, dbt, and BigQuery
  - Experience with PostgreSQL as a source system
  - Orchestration with Airflow
  - Familiarity with Fivetran for ingestion
  Nice to have: Monte Carlo or similar data observability tools, Snowflake.
canaries: [Airflow, Fivetran, Monte Carlo, Snowflake]
