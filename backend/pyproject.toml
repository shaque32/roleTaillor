[project]
name = "roletailor"
version = "0.1.0"
description = "RoleTailor: format-preserving, fact-grounded resume tailoring."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "anthropic>=1.0",
    "openai>=1.40",
    "python-docx>=1.1",
    "lxml>=5.2",
    "pypdf>=4.3",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "stripe>=10.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roletailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL database (RT_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
